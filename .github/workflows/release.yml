name: Publish Update Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: update-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout update channel
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up source deploy key
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_DEPLOY_KEY"
          mkdir -p "$RUNNER_TEMP/harukan-ssh"
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$RUNNER_TEMP/harukan-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/harukan-ssh/id_ed25519"
          ssh-keyscan github.com > "$RUNNER_TEMP/harukan-ssh/known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/harukan-ssh/id_ed25519 -o UserKnownHostsFile=$RUNNER_TEMP/harukan-ssh/known_hosts -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Checkout private source at release tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            git@github.com:Reboot-Together/harukan.git \
            "$RUNNER_TEMP/harukan-source"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build Windows package
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "harukan-source"
          $publish = Join-Path $env:RUNNER_TEMP "HaruKan-$env:GITHUB_REF_NAME-win-x64"
          $asset = Join-Path $env:RUNNER_TEMP "HaruKan-$env:GITHUB_REF_NAME-win-x64.zip"
          dotnet restore "$source/native/HaruKan.csproj"
          dotnet build "$source/native/HaruKan.csproj" --configuration Release --no-restore
          dotnet publish "$source/native/HaruKan.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output $publish
          Compress-Archive -Path "$publish/*" -DestinationPath $asset
          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            throw "Release $env:GITHUB_REF_NAME already exists. Refusing to overwrite it."
          }
          gh release create $env:GITHUB_REF_NAME $env:ASSET_PATH `
            --title "하루칸 $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag

      - name: Publish update manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          $assetName = Split-Path $env:ASSET_PATH -Leaf
          $sha256 = (Get-FileHash -LiteralPath $env:ASSET_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestPath = Join-Path $env:RUNNER_TEMP "update.json"
          [ordered]@{
            version = $version
            tag = $env:GITHUB_REF_NAME
            assetUrl = "https://github.com/Reboot-Together/harukan-releases/releases/download/$env:GITHUB_REF_NAME/$assetName"
            sha256 = $sha256
            releaseUrl = "https://github.com/Reboot-Together/harukan-releases/releases/tag/$env:GITHUB_REF_NAME"
            publishedAt = [DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8

          git fetch origin main
          git checkout main
          Copy-Item -LiteralPath $manifestPath -Destination update.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish update manifest for $env:GITHUB_REF_NAME"
            git push origin main
          }